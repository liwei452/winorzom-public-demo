name: Deploy public demo to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore generated image assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          if compgen -G "asset-src/*.b64" > /dev/null; then
            for f in asset-src/*.b64; do
              name="$(basename "$f" .b64)"
              base64 -d "$f" > "assets/$name"
            done
          fi
          rm -rf asset-src

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
